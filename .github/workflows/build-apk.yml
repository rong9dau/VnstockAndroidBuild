name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pick source ZIP
        run: |
          ls -la
          if [ -f "000_VNStockAndroid_GitHubGist_source_v7_hnx_upcom_fix.zip" ]; then
            ZIP_FILE="000_VNStockAndroid_GitHubGist_source_v7_hnx_upcom_fix.zip"
          else
            ZIP_FILE=$(ls *.zip | sort | head -n 1)
          fi
          echo "Using ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV

      - name: Unzip source
        run: |
          rm -rf source
          mkdir source
          unzip "$ZIP_FILE" -d source
          find source -maxdepth 4 -type f | head -150

      - name: Find Gradle project
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle.kts -o -name settings.gradle | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Gradle project dir: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d $HOME/gradle
          echo "$HOME/gradle/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace --info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VNStock-GitHub-Gist-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
